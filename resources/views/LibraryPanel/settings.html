<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Scholaria Settings</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="fixed inset-0 z-40 bg-slate-900/40 hidden lg:hidden" data-sidebar-overlay></div>
    <div class="app-shell flex min-h-screen">
      <aside class="app-sidebar fixed inset-y-0 left-0 z-50 flex flex-col border-r border-slate-200 bg-white">
        <div class="flex h-16 items-center justify-between border-b border-slate-200 px-4"><div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-lg bg-indigo-600 text-white">L</div><span class="label-text text-xl font-bold">Scholaria</span></div><button class="rounded-lg p-2 lg:hidden" data-close-mobile>✕</button></div>
        <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4 text-sm">
          <a href="./index.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>⌂</span><span class="label-text">Dashboard</span></a>
          <a href="./catalog.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>◫</span><span class="label-text">Catalog</span></a>
          <a href="./inventory.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>▦</span><span class="label-text">Inventory</span></a>
          <a href="./members.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>◎</span><span class="label-text">Members</span></a>
          <a href="./loans.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>⇄</span><span class="label-text">Loans</span></a>
          <a href="./reservations.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>◷</span><span class="label-text">Reservations</span></a>
          <a href="./reports.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-slate-600 hover:bg-slate-100"><span>▤</span><span class="label-text">Reports</span></a>
          <a href="./settings.html" class="flex items-center gap-3 rounded-lg bg-indigo-50 px-3 py-2.5 font-medium text-indigo-700"><span>⚙</span><span class="label-text">Settings</span></a>
        </nav>
        <button class="absolute -right-3 top-20 hidden h-6 w-6 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-400 shadow-sm lg:flex" data-toggle-collapse>⇆</button>
      </aside>
      <div class="app-main flex min-h-screen flex-1 flex-col">
        <header class="sticky top-0 z-30 flex h-16 items-center border-b border-slate-200 bg-white px-4 lg:px-8"><button class="rounded-lg p-2 lg:hidden" data-open-mobile>☰</button></header>
        <main class="page-fade w-full max-w-7xl flex-1 p-4 lg:mx-auto lg:p-8">
          <div class="mb-8"><h1 class="text-2xl font-bold">Settings</h1><p class="text-sm text-slate-500">Manage account and library preferences</p></div>
          <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
            <div class="border-b border-slate-200 flex overflow-x-auto text-sm">
              <button class="px-5 py-3 text-sm font-medium border-b-2 border-indigo-600 text-indigo-700 flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"></circle><path d="M20.24 20.24a8 8 0 0 0-16.48 0"></path></svg>
                Profile
              </button>
              <button class="px-5 py-3 text-sm text-slate-500 flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"></rect></svg>
                Library
              </button>
              <button class="px-5 py-3 text-sm text-slate-500 flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0"></path><path d="M6 20h12"></path></svg>
                Notifications
              </button>
              <button class="px-5 py-3 text-sm text-slate-500 flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5-3 5 3"></path></svg>
                Loan Rules
              </button>
              <button class="px-5 py-3 text-sm text-slate-500 flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20h5V10"></path><path d="M2 20h5V4"></path></svg>
                Members
              </button>
              <button class="px-5 py-3 text-sm text-slate-500 flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10h-6"></path><path d="M3 6h18"></path></svg>
                Integrations
              </button>
            </div>

            <div class="p-6 lg:p-8 max-w-2xl">
              <!-- Profile tab (active) -->
              <div class="space-y-6">
                <div class="flex items-center gap-4">
                  <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="avatar" class="w-16 h-16 rounded-full border border-slate-200" />
                  <div class="flex items-center gap-3">
                    <button class="px-3 py-1.5 text-sm font-medium text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-50">Change photo</button>
                    <span class="inline-block text-xs font-medium text-indigo-700 bg-indigo-50 px-2 py-1 rounded">Head Librarian</span>
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1.5">Full name</label>
                  <input type="text" value="Ms. Carter" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" />
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                  <input type="email" value="carter@school.edu" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" />
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1.5">Role</label>
                  <div><span class="inline-block text-xs font-medium text-indigo-700 bg-indigo-50 px-2 py-1 rounded">Head Librarian</span></div>
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1.5">Language</label>
                  <select class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    <option>English</option>
                    <option>Spanish</option>
                    <option>French</option>
                  </select>
                </div>

                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1.5">Timezone</label>
                  <select class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    <option>America/New_York</option>
                    <option>America/Los_Angeles</option>
                    <option>Europe/London</option>
                  </select>
                </div>

                <div class="pt-4 border-t border-slate-100">
                  <button class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">Save changes</button>
                </div>
              </div>
        </main>
      </div>
    </div>
    <script src="./assets/app.js"></script>
  </body>
</html>
